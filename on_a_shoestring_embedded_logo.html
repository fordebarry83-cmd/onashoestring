<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="On a Shoestring — find us, follow us and shop our trainers.">
<title>On a Shoestring | Find us &amp; shop</title>
<style>
:root{color-scheme:dark;--lime:#d8ff4f;--pink:#ff4f9a;--blue:#57d8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 18px 36px;background:radial-gradient(ellipse at 50% 0%,#292929 0,#151515 42%,#090909 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
main{width:100%;max-width:460px;margin:0 auto}
.hero{padding:22px 20px 25px;border:1px solid #ffffff28;border-radius:28px;background:linear-gradient(145deg,#202020,#141414);text-align:center;box-shadow:0 18px 48px #0006}
.logo{display:block;width:min(100%,300px);height:auto;aspect-ratio:1/1;object-fit:cover;margin:0 auto 20px;border-radius:18px}
h1{margin:0;font-size:clamp(29px,8vw,38px);font-weight:950;letter-spacing:-1.5px;line-height:1.05}
h1 span{color:var(--lime)}
.tagline{margin:12px 0 0;font-size:16px;color:#e0e0e0}
.dots{display:flex;gap:12px;justify-content:center;margin-top:22px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.dots i:nth-child(2){background:var(--lime)}.dots i:nth-child(3){background:var(--blue)}
hr{border:0;border-top:1px solid #ffffff24;margin:27px 0}
.heading{margin:0 4px 14px;font-size:12px;letter-spacing:2.5px;font-weight:850;color:#d1d1d1;text-transform:uppercase}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;min-height:68px;padding:15px 17px;border-radius:18px;background:#fff;color:#101010;text-decoration:none;font-size:17px;font-weight:800;box-shadow:0 5px 0 #0005;transition:transform .12s ease}
.link:active{transform:scale(.985)}
.icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#111;color:white;font-size:17px;font-weight:900}
.label{flex:1;overflow-wrap:anywhere}
.arrow{font-size:26px;color:#666;line-height:1}
.facebook .icon{background:#1877f2}.instagram .icon{background:linear-gradient(135deg,#7048c8,#f34284,#ffb547)}.tiktok .icon{background:#111;border:2px solid #25f4ee}.youtube .icon{background:#ff0033}
.vinted .icon{background:#159c73}.ebay .icon{background:#3665f3}.depop .icon{background:#ff5c8a}
footer{text-align:center;color:#aaa;font-size:12px;line-height:1.6;margin:24px 10px 0}
@media(min-width:500px){body{padding-top:38px}.hero{padding:25px 24px 28px}}
</style>
</head>
